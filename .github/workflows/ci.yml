name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: restore-build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore E2E.slnx

      - name: Build
        run: dotnet build E2E.slnx --no-restore -c Release

      - name: Test
        run: dotnet test E2E.slnx --no-build -c Release --filter "TestCategory!=RealModel" --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: |
          dotnet pack src/E2E/E2E.csproj -c Release -o artifacts --nologo
          dotnet pack src/E2E.NUnit/E2E.NUnit.csproj -c Release -o artifacts --nologo
          dotnet pack src/E2E.Cli/E2E.Cli.csproj -c Release -o artifacts --nologo
